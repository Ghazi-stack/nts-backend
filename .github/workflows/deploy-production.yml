name: Deploy to production

on:
  push:
    branches: [nts]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-ecom-api
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::651706754088:role/ecom-github-deploy-api
  BUCKET: ecom-prod-651706754088
  INSTANCE_ID: i-0d5a2bc3a06bc5069
  DOCUMENT: ecom-deploy-api

jobs:
  deploy:
    if: github.ref == 'refs/heads/nts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, gd, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Package release
        run: tar -czf "$RUNNER_TEMP/release.tar.gz" --exclude=./.git --exclude=./.github --exclude=./storage --exclude=./.env .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release
        run: aws s3 cp "$RUNNER_TEMP/release.tar.gz" "s3://$BUCKET/releases/api/$GITHUB_SHA.tar.gz" --only-show-errors

      - name: Deploy on server
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "$DOCUMENT" \
            --parameters "key=releases/api/$GITHUB_SHA.tar.gz" --query Command.CommandId --output text)
          status=Pending
          for i in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          echo "status: $status"
          test "$status" = Success
